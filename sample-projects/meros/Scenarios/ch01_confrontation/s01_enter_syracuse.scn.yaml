id: ch01_s01_enter_syracuse
title: 人気のないシラクス
chapter: ch01_confrontation
order: 1
location: 01MERS09LCTS0CD1NO9QRYS3IBLY
era: era.ancient
cast:
  - melos
script:
  - kind: bgm
    track: ancient_city_ambient

  - kind: aside
    text: |
      メロスは激怒した。必ず、かの邪智暴虐の王を除かなければならぬと決意した。
      メロスには政治がわからぬ。メロスは、村の牧人である。笛を吹き、羊と遊んで暮らしてきた。
      けれども邪悪に対しては、人一倍に敏感であった。

  - kind: aside
    text: |
      きょう未明メロスは村を出発し、野を越え山を越え、十里はなれた此のシラクスの市にやってきた。
      メロスには父も、母もない。女房もない。十六の、内気な妹と二人暮らしだ。
      この妹は、村の或る律気な一人の若者を、近々、花婿として迎える事になっていた。
      結婚式も間近かなのだ。メロスは、それゆえ、花婿のために贈る品々を買いに、はるばるこの市にやって来たのだ。

  - kind: stage
    text: シラクスの市場。しかし店は閉まり、行き交う人もなく、市は死んだように静まり返っている。

  - kind: aside
    text: |
      市場は、まるで眠りに落ちているかのようだった。
      メロスは、不審に思い、老爺に声をかけた。

  - kind: stage
    text: メロスは道端にうずくまっている老人に近づく。

  - kind: line
    who: melos
    emotion: puzzled
    text: 'おい、なぜ町中がこんなに寂しいのだ。'

  - kind: stage
    text: 老爺は、おびえたように周囲を見回してから、ぼそぼそと語り始めた。

  - kind: aside
    text: |
      老爺の話によると、最近、王が人を信ずることを止めたらしい。
      王は人を、ひとりひとり抹殺してしまう。
      先ず、王の妹婿を。次に、王妹を。それから、王の子を。
      それから、妹婿の父を。それから、そのまた父を。それから、家来を。それから、臣下を。
      誰でも彼でも、気に入らぬものは、死刑にしてしまう。
      今は、六人殺された。みんな、訳のわからぬ理由で。
      今朝も、呼ばれた人が一人、帰ってこない。
      きょうは、市の日だというのに、みんな、家の中に閉じこもっている、というのだ。

  - kind: line
    who: melos
    emotion: angry
    text: '何という王だ。生かして置けぬ。'

  - kind: sfx
    sound: melos_footsteps_fast

  - kind: aside
    text: メロスは単純だった。買い物を忘れ、ただ、わけのわからぬ大きい怒りに燃え、市場を駆け抜け、王城を目指した。
